# Unirust Cluster Compose Configuration
#
# Deploy a 3-shard cluster with router:
# This configuration uses plaintext internal traffic and no replicas. Separate
# named data/checkpoint volumes do not establish independent failure domains.
#
#   podman-compose up -d
#   podman-compose logs -f router
#
# Run loadtest:
#   podman-compose run --rm loadtest loadtest --router http://router:50060 --count 100000 --headless
# An explicit run command must retain the first "loadtest" entrypoint argument.
#
# Stop cluster while preserving data:
#   podman-compose down
#
# Explicitly delete shard data AND checkpoint volumes:
#   podman-compose down -v

services:
  # Shard nodes - horizontal scaling units
  shard-0:
    image: unirust:latest
    build:
      context: .
      dockerfile: Containerfile
    volumes:
      - shard-0-data:/data
      - shard-0-backup:/backup
      - ./examples/loadtest-ontology.json:/etc/unirust/ontology.json:ro
    command:
      ["shard", "--shard-id", "0", "--data-dir", "/data", "--backup-dir", "/backup", "--ontology", "/etc/unirust/ontology.json"]
    environment:
      UNIRUST_PROFILE: high-throughput
    networks:
      - unirust-net
    healthcheck:
      test: ["CMD", "unirust_healthcheck", "--shard", "http://127.0.0.1:50061"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  shard-1:
    image: unirust:latest
    build:
      context: .
      dockerfile: Containerfile
    command:
      ["shard", "--shard-id", "1", "--data-dir", "/data", "--backup-dir", "/backup", "--ontology", "/etc/unirust/ontology.json"]
    volumes:
      - shard-1-data:/data
      - shard-1-backup:/backup
      - ./examples/loadtest-ontology.json:/etc/unirust/ontology.json:ro
    environment:
      UNIRUST_PROFILE: high-throughput
    networks:
      - unirust-net
    healthcheck:
      test: ["CMD", "unirust_healthcheck", "--shard", "http://127.0.0.1:50061"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  shard-2:
    image: unirust:latest
    build:
      context: .
      dockerfile: Containerfile
    command:
      ["shard", "--shard-id", "2", "--data-dir", "/data", "--backup-dir", "/backup", "--ontology", "/etc/unirust/ontology.json"]
    volumes:
      - shard-2-data:/data
      - shard-2-backup:/backup
      - ./examples/loadtest-ontology.json:/etc/unirust/ontology.json:ro
    environment:
      UNIRUST_PROFILE: high-throughput
    networks:
      - unirust-net
    healthcheck:
      test: ["CMD", "unirust_healthcheck", "--shard", "http://127.0.0.1:50061"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Router - client-facing entry point
  router:
    image: unirust:latest
    build:
      context: .
      dockerfile: Containerfile
    command:
      [
        "router",
        "--shards",
        "shard-0:50061,shard-1:50061,shard-2:50061",
        "--ontology",
        "/etc/unirust/ontology.json",
        "--checkpoint-interval-secs",
        "${UNIRUST_CHECKPOINT_INTERVAL_SECS:-3600}",
      ]
    volumes:
      - ./examples/loadtest-ontology.json:/etc/unirust/ontology.json:ro
    ports:
      - "127.0.0.1:50060:50060"
    depends_on:
      shard-0:
        condition: service_healthy
      shard-1:
        condition: service_healthy
      shard-2:
        condition: service_healthy
    networks:
      - unirust-net
    healthcheck:
      test: ["CMD", "unirust_healthcheck", "--router", "http://127.0.0.1:50060"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Loadtest runner (optional, run with: podman-compose run loadtest)
  loadtest:
    image: unirust:latest
    build:
      context: .
      dockerfile: Containerfile
    command:
      ["loadtest", "--router", "http://router:50060", "--count", "100000", "--streams", "8", "--headless"]
    depends_on:
      router:
        condition: service_healthy
    networks:
      - unirust-net
    profiles:
      - tools

networks:
  unirust-net:
    driver: bridge

volumes:
  shard-0-data:
  shard-0-backup:
  shard-1-data:
  shard-1-backup:
  shard-2-data:
  shard-2-backup:
