# Unirust Configuration Example
#
# Copy this file to /etc/unirust/config.toml or use -c/--config to load it.
# Missing fields have defaults, but persistent shards still require data and
# checkpoint paths. Fill in the commented deployment-specific settings below.
# Environment variables override file settings (prefix: UNIRUST_)
# CLI arguments override environment variables

# Performance profile (determines internal tuning parameters)
# Options: balanced, low-latency, high-throughput, bulk-ingest, memory-saver,
# billion-scale, billion-scale-high-performance
profile = "high-throughput"

# Shard node configuration
[shard]
# Listen address for gRPC connections
listen = "0.0.0.0:50061"
# Shard ID (0-indexed, unique per shard)
id = 0
# Data directory for persistence (`--ephemeral` is required when omitted)
# data_dir = "/var/lib/unirust/shard-0"
# Checkpoint root on an independent volume (use a unique path per shard)
# backup_dir = "/var/backups/unirust/shard-0"
# Path to ontology configuration (JSON)
# ontology = "/etc/unirust/ontology.json"
# Mutually authenticated TLS server credentials (all three are required together)
# tls_cert = "/etc/unirust/tls/shard-0.crt"
# tls_key = "/etc/unirust/tls/shard-0.key"
# tls_client_ca = "/etc/unirust/tls/clients-ca.crt"
# Primary-only synchronous replica settings. Bootstrap both volumes from the
# same committed checkpoint, or start both empty, before enabling these options.
# replica = "https://shard-0-replica:50061"
# replication_token_file = "/etc/unirust/replication/shard-0.token"
# replica_tls_ca = "/etc/unirust/tls/replicas-ca.crt"
# replica_tls_cert = "/etc/unirust/tls/shard-0-primary.crt"
# replica_tls_key = "/etc/unirust/tls/shard-0-primary.key"
# On the passive process, omit `replica` and set:
# replica_mode = true
# Plaintext replication is rejected unless explicitly enabled for isolated
# development:
# allow_insecure_replication = false
# Run RocksDB repair before opening. This is explicit corruption salvage, not
# normal crash recovery; normal WAL replay is automatic. Retain an untouched
# copy of the damaged database before attempting repair.
repair = false

# Router node configuration
[router]
# Listen address for gRPC connections
listen = "0.0.0.0:50060"
# Shard addresses (http:// prefix added automatically if missing)
shards = [
    "shard-0:50061",
    "shard-1:50061",
    "shard-2:50061",
]
# Alternative: load shards from file (one address per line)
# shards_file = "/etc/unirust/shards.txt"
# Path to ontology configuration (JSON)
# ontology = "/etc/unirust/ontology.json"
# Router-to-shard failure bounds
shard_connect_timeout_secs = 10
shard_request_timeout_secs = 120
shard_tcp_keepalive_secs = 30
# Automatic coordinated checkpoint interval (0 disables)
# checkpoint_interval_secs = 3600
# Mutually authenticated TLS for clients connecting to the router
# tls_cert = "/etc/unirust/tls/router.crt"
# tls_key = "/etc/unirust/tls/router.key"
# tls_client_ca = "/etc/unirust/tls/clients-ca.crt"
# Router identity and trust for https:// shard addresses
# shard_tls_ca = "/etc/unirust/tls/shards-ca.crt"
# shard_tls_cert = "/etc/unirust/tls/router-client.crt"
# shard_tls_key = "/etc/unirust/tls/router-client.key"

# RocksDB tuning is read directly from environment variables by PersistentStore.
# The parsed [storage] configuration is currently not wired to shard startup.
# Examples (set in the process environment, not as TOML fields):
# UNIRUST_BLOCK_CACHE_MB=512
# UNIRUST_WRITE_BUFFER_MB=128
# UNIRUST_RATE_LIMIT_MBPS=20
# UNIRUST_COMPACTION_THREADS=1
# UNIRUST_FLUSH_THREADS=2

# Advanced reconciliation tuning
# Controls cross-shard cluster reconciliation in distributed mode.
[reconciliation]
# Maximum staleness before forced reconcile (seconds)
max_staleness_secs = 60
# Minimum interval between reconciles (seconds)
min_interval_secs = 5
